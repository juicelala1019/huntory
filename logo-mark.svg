<svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Huntory Logo</title>
  <!-- 猎场标记：放大镜 + 向上箭头，象征「找到真正能帮你向前一步的资源」 -->
  <circle cx="14.5" cy="16.5" r="8" stroke="currentColor" stroke-width="2.6" />
  <!-- 放大镜手柄 -->
  <path d="M20.4 22.4L25.6 27.6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
  <!-- 镜内向上箭头 = 向前一步 -->
  <path d="M14.5 19.5V12.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
  <path d="M11.4 15.4L14.5 12.1l3.1 3.3" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
